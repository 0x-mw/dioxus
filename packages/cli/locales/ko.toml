en = "Experimental: Bundle split the wasm binary into multiple chunks based on `#[wasm_split]` annotations [default: false]"
ko = "실험적: `#[wasm_split]` 어노테이션을 기준으로 wasm 바이너리를 여러 청크로 번들 분할합니다 [기본값: false]"

# kind: help
# path: dx serve --debug-symbols
[[text]]
en = "Generate debug symbols for the wasm binary [default: true]"
ko = "wasm 바이너리의 디버그 심볼을 생성합니다 [기본값: true]"

# kind: long_help
# path: dx serve --debug-symbols
[[text]]
en = "Generate debug symbols for the wasm binary [default: true]\n\nThis will make the binary larger and take longer to compile, but will allow you to debug the wasm binary"
ko = "wasm 바이너리의 디버그 심볼을 생성합니다 [기본값: true]\n\n바이너리가 커지고 컴파일 시간이 길어지지만 wasm 바이너리를 디버그할 수 있습니다"

# kind: help
# path: dx serve --keep-names
[[text]]
en = "Keep the name section in the wasm binary, useful for profiling and debugging [default: false]"
ko = "wasm 바이너리의 name 섹션을 유지합니다. 프로파일링과 디버깅에 유용합니다 [기본값: false]"

# kind: long_help
# path: dx serve --keep-names
[[text]]
en = "Keep the name section in the wasm binary, useful for profiling and debugging [default: false]\n\nUnlike --debug-symbols which preserves DWARF debug info (requiring a browser extension to read), the name section allows tools like console_error_panic_hook to print backtraces with human-readable function names without any browser extension."
ko = "wasm 바이너리의 name 섹션을 유지합니다. 프로파일링과 디버깅에 유용합니다 [기본값: false]\n\nDWARF 디버그 정보를 보존하는 --debug-symbols는 읽으려면 브라우저 확장이 필요하지만, name 섹션을 유지하면 브라우저 확장 없이도 console_error_panic_hook 같은 도구가 사람이 읽을 수 있는 함수 이름이 담긴 백트레이스를 출력할 수 있습니다."

# kind: help
# path: dx serve --device
[[text]]
en = "The name of the device we are hoping to upload to. By default, dx tries to upload to the active simulator. If the device name is passed, we will upload to that device instead"
ko = "업로드하려는 기기의 이름입니다. 기본적으로 dx는 실행 중인 시뮬레이터에 업로드하려고 시도합니다. 기기 이름을 지정하면 해당 기기에 업로드합니다"

# kind: long_help
# path: dx serve --device
[[text]]
en = "The name of the device we are hoping to upload to. By default, dx tries to upload to the active simulator. If the device name is passed, we will upload to that device instead.\n\nThis performs a search among devices, and fuzzy matches might be found."
ko = "업로드하려는 기기의 이름입니다. 기본적으로 dx는 실행 중인 시뮬레이터에 업로드하려고 시도합니다. 기기 이름을 지정하면 해당 기기에 업로드합니다.\n\n기기 목록에서 검색을 수행하므로 유사 일치(fuzzy match)가 발견될 수 있습니다."

# kind: help
# path: dx serve --base-path
[[text]]
en = "The base path the build will fetch assets relative to. This will override the base path set in the `dioxus` config"
ko = "빌드가 에셋을 가져올 때 기준으로 삼는 기본 경로입니다. `dioxus` 설정에 지정된 기본 경로보다 우선합니다"

# kind: help
# path: dx serve --codesign
[[text]]
en = "Should dx attempt to codesign the app bundle?"
ko = "dx가 앱 번들에 코드 서명을 시도할지 여부입니다"

# kind: help
# path: dx serve --apple-entitlements
[[text]]
en = "The path to the Apple entitlements file to used to sign the resulting app bundle"
ko = "결과 앱 번들에 서명할 때 사용할 Apple 엔타이틀먼트 파일의 경로입니다"

# kind: long_help
# path: dx serve --apple-entitlements
[[text]]
en = "The path to the Apple entitlements file to used to sign the resulting app bundle.\n\nOn iOS, this is required for deploy to a device and some configurations in the simulator."
ko = "결과 앱 번들에 서명할 때 사용할 Apple 엔타이틀먼트 파일의 경로입니다.\n\niOS에서는 기기에 배포하거나 시뮬레이터의 일부 설정을 사용할 때 필요합니다."

# kind: help
# path: dx serve --apple-team-id
[[text]]
en = "The Apple team ID to use when signing the app bundle"
ko = "앱 번들에 서명할 때 사용할 Apple 팀 ID입니다"

# kind: long_help
# path: dx serve --apple-team-id
[[text]]
en = "The Apple team ID to use when signing the app bundle.\n\nUsually this is an email or name associated with your Apple Developer account, usually in the format `Signing Name (GXTEAMID123)`.\n\nThis is passed directly to the `codesign` tool.\n\n``` codesign --force --entitlements <entitlements_file> --sign <apple_team_id> <app_bundle> ```"
ko = "앱 번들에 서명할 때 사용할 Apple 팀 ID입니다.\n\n보통 Apple Developer 계정에 연결된 이메일 또는 이름이며, 대개 `Signing Name (GXTEAMID123)` 형식입니다.\n\n이 값은 `codesign` 도구에 그대로 전달됩니다.\n\n``` codesign --force --entitlements <entitlements_file> --sign <apple_team_id> <app_bundle> ```"

# kind: help
# path: dx serve --session-cache-dir
[[text]]
en = "The folder where DX stores its temporary artifacts for things like hotpatching, build caches, window position, etc. This is meant to be stable within an invocation of the CLI, but you can persist it by setting this flag"
ko = "DX가 핫 패치, 빌드 캐시, 창 위치 등을 위한 임시 파일을 저장하는 폴더입니다. CLI를 한 번 실행하는 동안에는 일정하게 유지되며, 이 플래그를 설정하면 계속 보존할 수 있습니다"

# kind: help
# path: dx serve --client-target
[[text]]
en = "The target for the client build, used for specifying which target the server should end up in when merging `@client and @server` targets together"
ko = "클라이언트 빌드의 타깃입니다. `@client and @server` 타깃을 병합할 때 서버가 어느 타깃에 들어가야 하는지 지정하는 데 사용합니다"

# kind: help
# path: dx serve --wasm-js-cfg
[[text]]
en = "Automatically pass `--features=js_cfg` when building for wasm targets. This is enabled by default"
ko = "wasm 타깃을 빌드할 때 `--features=js_cfg`를 자동으로 전달합니다. 기본으로 활성화되어 있습니다"

# kind: help
# path: dx serve --windows-subsystem
[[text]]
en = "The Windows subsystem to use when building for Windows targets. This can be either `CONSOLE` or `WINDOWS`"
ko = "Windows 타깃을 빌드할 때 사용할 Windows 서브시스템입니다. `CONSOLE` 또는 `WINDOWS`를 지정할 수 있습니다"

# kind: long_help
# path: dx serve --windows-subsystem
[[text]]
en = "The Windows subsystem to use when building for Windows targets. This can be either `CONSOLE` or `WINDOWS`.\n\nBy default, DX uses `WINDOWS` since it assumes a GUI application, but you can override this behavior with this flag.\n\nSee <https://learn.microsoft.com/en-us/cpp/build/reference/subsystem-specify-subsystem?view=msvc-170> for more information."
ko = "Windows 타깃을 빌드할 때 사용할 Windows 서브시스템입니다. `CONSOLE` 또는 `WINDOWS`를 지정할 수 있습니다.\n\n기본적으로 DX는 GUI 애플리케이션으로 가정하고 `WINDOWS`를 사용하지만, 이 플래그로 동작을 바꿀 수 있습니다.\n\n자세한 내용은 다음을 참고하십시오: <https://learn.microsoft.com/en-us/cpp/build/reference/subsystem-specify-subsystem?view=msvc-170>."

# kind: help
# path: dx serve --raw-json-diagnostics
[[text]]
en = "Output raw JSON diagnostics from cargo instead of processing them [default: false]"
ko = "cargo의 JSON 진단을 처리하지 않고 원본 그대로 출력합니다 [기본값: false]"

# kind: long_help
# path: dx serve --raw-json-diagnostics
[[text]]
en = "Output raw JSON diagnostics from cargo instead of processing them [default: false]\n\nWhen enabled, cargo's JSON output will be relayed directly to stdout without any processing or formatting by DX. This is useful for integration with other tools that expect cargo's raw JSON format."
ko = "cargo의 JSON 진단을 처리하지 않고 원본 그대로 출력합니다 [기본값: false]\n\n활성화하면 cargo의 JSON 출력이 DX의 처리나 서식 지정 없이 stdout으로 그대로 전달됩니다. cargo의 원본 JSON 형식을 기대하는 다른 도구와 연동할 때 유용합니다."

# kind: help
# path: dx serve --args
[[text]]
en = "Additional arguments to pass to the executable"
ko = "실행 파일에 전달할 추가 인자입니다"

