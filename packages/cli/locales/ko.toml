ko = "컴포넌트가 이미 있으면 덮어씁니다"

# kind: about
# path: dx components remove
[[text]]
en = "Remove a component"
ko = "컴포넌트를 제거합니다"

# kind: about
# path: dx components update
[[text]]
en = "Update a component registry"
ko = "컴포넌트 레지스트리를 업데이트합니다"

# kind: about
# path: dx components list
[[text]]
en = "List available components in a registry"
ko = "레지스트리에서 사용 가능한 컴포넌트를 나열합니다"

# kind: about
# path: dx components clean
[[text]]
en = "Clear the component registry cache"
ko = "컴포넌트 레지스트리 캐시를 지웁니다"

# kind: about
# path: dx components schema
[[text]]
en = "Print the schema for component manifests"
ko = "컴포넌트 매니페스트의 스키마를 출력합니다"

