ko = "최종 번들을 저장할 디렉터리입니다"

# kind: long_help
# path: dx bundle --out-dir
[[text]]
en = "The directory in which the final bundle will be placed.\n\nRelative paths will be placed relative to the current working directory if specified. Otherwise, the out_dir path specified in Dioxus.toml will be used (relative to the crate root).\n\nWe will flatten the artifacts into this directory - there will be no differentiation between artifacts produced by different platforms."
ko = "최종 번들을 저장할 디렉터리입니다.\n\n지정한 경우 상대 경로는 현재 작업 디렉터리를 기준으로 합니다. 지정하지 않으면 Dioxus.toml에 지정된 out_dir 경로를 사용합니다(크레이트 루트 기준).\n\n빌드 산출물은 이 디렉터리에 평탄화되어 저장되며, 플랫폼별로 만들어진 산출물을 구분하지 않습니다."

# kind: about
# path: dx build
