[[text]]
en = "Print the arguments as a list of arguments, one per line. Does not include the `cargo rustc` command itself"
ko = "인자를 한 줄에 하나씩 목록으로 출력합니다. `cargo rustc` 명령 자체는 포함하지 않습니다"

