# dx CLI 한국어 번역표 (DX_LANG=en 이면 사용하지 않습니다)
#
# 형식과 규칙 요약
#  1. 표는 [[text]] 와 [[fmt]] 두 종류뿐이며 필드는 en, ko 둘뿐입니다.
#  2. 값은 한 줄 기본 문자열("...")만 씁니다. 줄바꿈은 \n, 그 밖의 이스케이프는 \" \\ \t \uXXXX 입니다.
#     여러 줄 문자열("""...""")과 리터럴 문자열('...')은 금지입니다.
#  3. [[text]]: en 은 화면에 나오는 문자열과 완전히 같아야 합니다(정적 라벨, 도움말). ko 에 {n} 은 쓰지 않습니다.
#  4. [[fmt]]: en 은 Rust 서식 문자열의 한 줄이며 자리표시자가 1개 이상이고 리터럴 알파벳이 4자 이상이어야 합니다.
#     리터럴 없이 붙은 자리표시자({GLOW_STYLE}{}{GLOW_STYLE:#})는 값 묶음 1개이며 번호는 왼쪽부터 1, 2, ... 입니다.
#     ko 는 {1}..{N} 으로 묶음을 참조하고(같은 번호 반복 가능) 모든 묶음을 최소 1회 사용해야 합니다.
#     {{ 와 }} 는 문자 그대로의 중괄호입니다.
#  5. en 이 값 묶음으로 끝나면 ko 도 마지막 묶음 참조로 끝나야 하고, en 이 값 묶음으로 시작하면 ko 도 {1} 로 시작해야 합니다.
#  6. 같은 en 이 두 번(종류와 무관하게) 나오면 오류입니다.
#  7. ko = "" 는 미번역(건너뜀), ko = en 은 번역이 필요 없는 문구로 처리 완료 표시입니다.
#  8. 주석 형식: "# == 구역: ... ==" 머리, 선택적 "# src: 파일", "# 값: {1}=... {2}=..." (런타임은 주석을 무시합니다).
#
# 문체는 합니다체이며 명령·옵션 이름, 경로, 코드, 플랫폼 이름은 영어로 둡니다.

