[[text]]
en = "Format print Dioxus config"
ko = "Dioxus 설정을 포맷하여 출력합니다"

# kind: about
# path: dx config custom-html
[[text]]
en = "Create a custom html file"
ko = "사용자 지정 html 파일을 만듭니다"

# kind: about
# path: dx config set
[[text]]
en = "Set CLI settings"
ko = "CLI 설정을 지정합니다"

# kind: about
# path: dx config set always-open-browser
[[text]]
en = "Set the value of the always-open-browser setting"
ko = "always-open-browser 설정의 값을 지정합니다"

# kind: about
# path: dx config set always-on-top
[[text]]
en = "Set the value of the always-on-top desktop setting"
ko = "always-on-top 데스크톱 설정의 값을 지정합니다"

# kind: about
# path: dx config set wsl-file-poll-interval
[[text]]
en = "Set the interval that file changes are polled on WSL for hot reloading"
ko = "핫 리로드를 위해 WSL에서 파일 변경을 폴링하는 간격을 지정합니다"

# kind: about
# path: dx config set disable-telemetry
# glossary-ok: build
[[text]]
en = "Disable the built-in telemetry for the CLI"
ko = "CLI에 내장된 텔레메트리를 끕니다"

# kind: about
# path: dx config set preferred-editor
[[text]]
en = "Set the preferred editor for debug sessions"
ko = "디버그 세션에서 사용할 선호 편집기를 지정합니다"

# kind: possible_value
# path: dx config set preferred-editor value [vscode]
[[text]]
en = "Visual Studio Code"
ko = "Visual Studio Code"

# kind: possible_value
# path: dx config set preferred-editor value [cursor]
[[text]]
en = "Cursor editor"
ko = "Cursor 편집기"

# kind: about
# path: dx config schema
[[text]]
en = "Generate JSON schema for Dioxus.toml configuration. Useful for IDE autocomplete and validation"
ko = "Dioxus.toml 설정용 JSON 스키마를 생성합니다. IDE 자동 완성과 검증에 유용합니다"

# kind: help
# path: dx config schema --out
[[text]]
en = "Output file path. If not provided, prints to stdout"
ko = "출력 파일 경로입니다. 지정하지 않으면 stdout으로 출력합니다"

# kind: about
# path: dx self-update
[[text]]
en = "Update the Dioxus CLI to the latest version"
ko = "Dioxus CLI를 최신 버전으로 업데이트합니다"

# kind: help
# path: dx self-update --nightly
[[text]]
en = "Use the latest nightly build"
ko = "최신 nightly 빌드를 사용합니다"

# kind: help
# path: dx self-update --version
[[text]]
en = "Specify a version to install"
ko = "설치할 버전을 지정합니다"

# kind: help
# path: dx self-update --install
[[text]]
en = "Install the update"
ko = "업데이트를 설치합니다"

# kind: help
# path: dx self-update --list
[[text]]
en = "List available versions"
ko = "사용 가능한 버전을 나열합니다"

# kind: help
# path: dx self-update --force
[[text]]
en = "Force the update even if the current version is up to date"
ko = "현재 버전이 최신이어도 업데이트를 강제로 진행합니다"

# kind: about
# path: dx tools
[[text]]
en = "Run a dioxus build tool. IE `build-assets`, `hotpatch`, etc"
ko = "dioxus 빌드 도구를 실행합니다. 예: `build-assets`, `hotpatch` 등"

# kind: about
# path: dx tools assets
[[text]]
en = "Build the assets for a specific target"
ko = "특정 타깃용 에셋을 빌드합니다"

# kind: help
# path: dx tools assets executable
[[text]]
en = "The source executable to build assets for"
ko = "에셋을 빌드할 원본 실행 파일입니다"

# kind: help
# path: dx tools assets destination
[[text]]
en = "The destination directory for the assets"
ko = "에셋을 저장할 대상 디렉터리입니다"

# kind: about
# path: dx tools hotpatch
[[text]]
en = "Hotpatch the \"tip\" of a given \"fat\" binary. The output here must be from the `dx build` command with \"fat\" enabled"
ko = "지정한 \"fat\" 바이너리의 \"tip\"을 핫 패치합니다. 여기에 쓰는 결과물은 \"fat\"을 켜고 실행한 `dx build` 명령의 결과여야 합니다"

# kind: help
# path: dx tools hotpatch --patch-server
[[text]]
en = "Should we patch the server or the client? False = client, True = server"
ko = "서버를 패치할지 클라이언트를 패치할지 지정합니다. False = 클라이언트, True = 서버"

# kind: heading
# path: dx tools hotpatch --patch-server
[[text]]
en = "Hotpatching a binary"
ko = "바이너리 핫 패치"

# kind: help
# path: dx tools hotpatch --aslr-reference
[[text]]
en = "The ASLR reference of the running app being patched. Used to generate sensible offsets for patched code"
ko = "패치할 실행 중인 앱의 ASLR 기준값입니다. 패치된 코드에 알맞은 오프셋을 계산하는 데 사용됩니다"

# kind: about
# path: dx components
[[text]]
en = "Manage components from the `dioxus-component` registry"
ko = "`dioxus-component` 레지스트리의 컴포넌트를 관리합니다"

# kind: about
# path: dx components add
[[text]]
en = "Add a component from a registry"
ko = "레지스트리에서 컴포넌트를 추가합니다"

# kind: help
# path: dx components add components
[[text]]
en = "The components to add or remove"
ko = "추가하거나 제거할 컴포넌트입니다"

# kind: help
# path: dx components add --module-path
[[text]]
en = "The location of the component module in your project (default: src/components)"
ko = "프로젝트 안 컴포넌트 모듈의 위치입니다 (기본값: src/components)"

# kind: help
# path: dx components add --global-assets-path
[[text]]
en = "The location of the global assets in your project (default: assets)"
ko = "프로젝트 안 전역 에셋의 위치입니다 (기본값: assets)"

# kind: help
# path: dx components add --all
[[text]]
en = "Include all components in the registry"
ko = "레지스트리의 모든 컴포넌트를 포함합니다"

# kind: help
# path: dx components add --git
[[text]]
en = "The url of the component registry"
ko = "컴포넌트 레지스트리의 URL입니다"

# kind: help
# path: dx components add --rev
[[text]]
en = "The revision of the component registry"
ko = "컴포넌트 레지스트리의 리비전입니다"

# kind: help
# path: dx components add --path
[[text]]
en = "The path to the components directory"
ko = "컴포넌트 디렉터리 경로입니다"

# kind: help
# path: dx components add --force
[[text]]
