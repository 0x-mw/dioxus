ko = "자동 완성을 생성할 셸입니다"

# kind: about
# path: dx print
[[text]]
en = "Print project information in a structured format, like cargo args, linker args, and other flags DX sets that might be useful in third-party tools"
ko = "cargo 인자, 링커 인자 등 DX가 설정하는 플래그처럼 서드파티 도구에 유용할 수 있는 프로젝트 정보를 구조화된 형식으로 출력합니다"

# kind: about
# path: dx print client-args
[[text]]
en = "Print the cargo args dioxus uses to build the server app. Environment variables will be set with the `env` command"
ko = "dioxus가 서버 앱을 빌드할 때 사용하는 cargo 인자를 출력합니다. 환경 변수는 `env` 명령으로 설정됩니다"

# kind: help
# path: dx print client-args --style
[[text]]
en = "The print output style to use. By default, this uses the current-platform's best fit, though you can customize it in the case you might be driving an external build system. - Unix style uses the `env` command - Windows style uses the `set` command - JSON style prints the arguments as JSON - Pretty JSON style prints the arguments as pretty JSON - Args style prints only the arguments, one per line, without any environment variables. - Env style prints only the environment variables, one key-pair per line, without any arguments"
ko = "사용할 출력 스타일입니다. 기본값은 현재 플랫폼에 가장 알맞은 스타일이지만, 외부 빌드 시스템을 구동하는 경우 직접 지정할 수 있습니다. - Unix 스타일은 `env` 명령을 사용합니다 - Windows 스타일은 `set` 명령을 사용합니다 - JSON 스타일은 인자를 JSON으로 출력합니다 - Pretty JSON 스타일은 인자를 보기 좋게 정리한 JSON으로 출력합니다 - Args 스타일은 환경 변수 없이 인자만 한 줄에 하나씩 출력합니다. - Env 스타일은 인자 없이 환경 변수만 한 줄에 키-값 쌍 하나씩 출력합니다"

# kind: possible_value
