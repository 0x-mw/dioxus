# kind: possible_value
# path: dx bundle --package-types [apk]
[[text]]
en = "Android application package (.apk)"
ko = "Android 애플리케이션 패키지(.apk)"

# kind: possible_value
# path: dx bundle --package-types [aab]
[[text]]
en = "Android App Bundle (.aab)"
